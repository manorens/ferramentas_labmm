<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CentroWEG | Inventário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="tech-frame">

        <div class="header-inner">

           <div class="logo-slot">
            <div class="logo-circle">
            <img
            src="weg.png"
            alt="Logo CentroWEG"
            class="logo-img"
            onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-placeholder',innerHTML:'<span>LOGO</span>'}));">
        </div>
        </div>

            <div class="header-text">

                <p class="eyebrow">Sistema de Inventário</p>

                <h1>CentroWEG</h1>

                <p class="subtitle">Inventário de Ferramentas — Laboratório de Manutenção</p>

            </div>

        </div>

    </header>


    <main>


        <section class="cadastro">

            <h2>Cadastrar ferramenta</h2>

            <form id="formInsumo">

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código"
                >

                <input
                    type="text"
                    id="descricao"
                    placeholder="Descrição"
                    required
                >

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade"
                    min="0"
                    required
                >

                <select id="categoria" required>

                    <option value="">
                        Selecione uma categoria
                    </option>

                    <option value="Instrumento de Medição">
                        Instrumento de Medição
                    </option>

                    <option value="Elemento de Fixação">
                        Elemento de Fixação
                    </option>

                    <option value="Chaves">
                        Chaves
                    </option>

                    <option value="Ferramentas Manuais">
                        Ferramentas Manuais
                    </option>

                    <option value="Ferramenta de Desbaste">
                        Ferramenta de Desbaste
                    </option>

                    <option value="Rolamentos">
                        Rolamentos
                    </option>

                </select>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <section class="pesquisa">

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar ferramenta..."
            >

            <select id="filtroCategoria">

                <option value="">
                    Todas as categorias
                </option>

                <option value="Instrumento de Medição">
                    Instrumento de Medição
                </option>

                <option value="Elemento de Fixação">
                    Elemento de Fixação
                </option>

                <option value="Chaves">
                    Chaves
                </option>

                <option value="Ferramentas Manuais">
                    Ferramentas Manuais
                </option>

                <option value="Ferramenta de Desbaste">
                    Ferramenta de Desbaste
                </option>

                <option value="Rolamentos">
                    Rolamentos
                </option>

            </select>

        </section>


        <section class="tabela-secao">

            <h2>Ferramentas disponíveis</h2>

            <div class="tabela-scroll">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Código</th>

                            <th>Descrição</th>

                            <th>Quantidade</th>

                            <th>Categoria</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="tabelaInsumos">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <div id="modal" class="modal">

        <div class="modal-conteudo">

            <h2>Editar ferramenta</h2>

            <form id="formEditar">

                <input type="hidden" id="editarId">

                <input
                    type="text"
                    id="editarCodigo"
                    placeholder="Código"
                >

                <input
                    type="text"
                    id="editarDescricao"
                    placeholder="Descrição"
                    required
                >

                <input
                    type="number"
                    id="editarQuantidade"
                    placeholder="Quantidade"
                    min="0"
                    required
                >

                <select id="editarCategoria" required>

                    <option value="Instrumento de Medição">
                        Instrumento de Medição
                    </option>

                    <option value="Elemento de Fixação">
                        Elemento de Fixação
                    </option>

                    <option value="Chaves">
                        Chaves
                    </option>

                    <option value="Ferramentas Manuai">
                        Ferramentas Manuais
                    </option>

                    <option value="Ferramenta de Desbaste">
                        Ferramenta de Desbaste
                    </option>

                    <option value="Rolamentos">
                        Rolamentos
                    </option>

                </select>

                <button type="submit">
                    Salvar alterações
                </button>

                <button
                    type="button"
                    class="btn-cancelar"
                    onclick="fecharModal()"
                >
                    Cancelar
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
